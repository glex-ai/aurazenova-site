<style>
  :root { --bg:#0B0B0C; --gold:#D4AF37; --cream:#F4F1EA; --muted:#8A8474; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#000;
    color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  .logo { width:clamp(280px, 56vw, 640px); height:auto; display:block; }
        h1 { font-weight:300; font-size:clamp(46px, 9vw, 104px); letter-spacing:0.02em; line-height:1; }
  h1 .cap { font-weight:400; font-size:1.42em; color:var(--gold); }
  .sector { margin-top:40px; font-size:clamp(11px, 1.4vw, 14px); letter-spacing:0.32em; text-transform:uppercase; color:var(--muted); }
  .line { width:80px; height:1px; background:var(--gold); margin:30px auto; }
  .motto { font-size:clamp(17px, 2.2vw, 22px); font-weight:300; font-style:italic; }
  .soon { margin-top:42px; font-size:12px; letter-spacing:0.4em; text-transform:uppercase; color:var(--cream); opacity:.75; }
  footer { position:fixed; bottom:22px; left:0; right:0; font-size:12px; color:var(--muted); letter-spacing:0.08em; }
  .fade { animation:fade 1.4s ease both; }
  .d2 { animation-delay:.3s; } .d3 { animation-delay:.6s; } .d4 { animation-delay:.9s; }
  @keyframes fade { from { opacity:0; transform:translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { .fade { animation:none; } }
  @media (max-width: 600px) { .sector { letter-spacing:0.14em; font-size:10.5px; } .soon { letter-spacing:0.25em; } }
